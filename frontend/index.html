<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prevent browser from caching the HTML shell — ensures fresh chunk URLs after deploy -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Bookshelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- SVG favicon -- identical geometry to Logo.tsx (showBackground=false, 48x48) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Crect width='48' height='48' rx='5' fill='%23fbbf24'/%3E%3Cg transform='translate(-0.5%2C0)'%3E%3Crect x='14' y='6' width='30' height='22' rx='3.5' fill='%231c3089' opacity='0.28'/%3E%3Crect x='9' y='13' width='30' height='22' rx='3.5' fill='%231c3089' opacity='0.55'/%3E%3Crect x='5' y='20' width='30' height='22' rx='3.5' fill='%231c3089'/%3E%3Crect x='10' y='28' width='13' height='3' rx='1.5' fill='white' opacity='0.3'/%3E%3Cpath d='M29 20 L37 20 L37 32 L33 29 L29 32 Z' fill='%23f59e0b'/%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services -- loaded once, used by GoogleSignInButton -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Force dark caret on focus for all light-background inputs
      document.addEventListener("focusin", function(e) {
        var el = e.target;
        if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
          // Only override caret on light backgrounds (not the PDF viewer dark toolbar)
          var bg = window.getComputedStyle(el).backgroundColor;
          var isDark = bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent" &&
            (function(c) {
              var m = c.match(/\d+/g);
              if (!m) return false;
              // Perceived brightness formula
              return (m[0]*0.299 + m[1]*0.587 + m[2]*0.114) < 128;
            })(bg);
          el.style.caretColor = isDark ? "white" : "#1e293b";
        }
      }, true);
    </script>
  </head>
  <body class="bg-paper-50 text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
